version: '3'

services:

  calibre-bot:
    image: jsavargas/calibre-upload-bot
    container_name: calibre-bot
    restart: unless-stopped
    network_mode: host
    environment:
      - TG_AUTHORIZED_USER_ID=${TG_AUTHORIZED_USER_ID}
      - TG_AUTHORIZED_CONVERT_USER_ID=${TG_AUTHORIZED_CONVERT_USER_ID}
      - TG_API_ID=${TG_API_ID}
      - TG_API_HASH=${TG_API_HASH}
      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      - TG_TIMEOUT=${TG_TIMEOUT}
      - TZ=${TZ}
    volumes:
      - /path/to/config:/config
      - /media/volume_1/books/biblioteca_88.234:/books  # Calibre folder (library) where the database is located (metadata.db)
      - /media/volume_1/books/mobi:/mobi              # folder where the epub converted to mobi will be left
      - /media/volume_1/books/imports:/imports        # folder where the original epub files will be left
